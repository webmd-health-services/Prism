
Build:
- Version:
    Path: Prism\Prism.psd1
    Prerelease:
    - main: ""
    - "*": rc1
    IncrementPrereleaseVersion: true

# Update the AppVeyor build/version number.
- Exec: appveyor UpdateBuild -Version "$(WHISKEY_SEMVER2)+$(WHISKEY_BUILD_NUMBER)"
  .OnlyBy: BuildServer

# Dot-sourcing files is expensive. Move all functions into .psm1 file to improve import speed. Do this before testing
# to ensure the module still works.
- MergeFile:
    .OnlyBy: BuildServer
    # Builds run twice on some serves. Only run this step if the module hasn't been merged yet.
    .IfExists: Prism\Functions\*.ps1
    Path:
    - Prism\Functions\*.ps1
    DestinationPath: Prism\Prism.psm1
    DeleteSourceFiles: true
    TextSeparator: "$(NewLine)$(NewLine)"

- PowerShell: .\reset.ps1
  .OnlyDuring: Clean

# Build runs twice on some servers, so delete any ZIP file created by another build.
- Delete:
    Path: $(WHISKEY_OUTPUT_DIRECTORY)\*.zip

- CopyFile:
    Path:
    - CHANGELOG.md
    - README.md
    - LICENSE
    - NOTICE
    DestinationDirectory: Prism

- Zip:
    ArchivePath: $(WHISKEY_OUTPUT_DIRECTORY)\Prism-$(WHISKEY_SEMVER2_NO_BUILD_METADATA).zip
    Path:
    - Prism
    Exclude:
    - "*.pdb"
    - "*.orig"

- Exec: appveyor PushArtifact '$(WHISKEY_OUTPUT_DIRECTORY)/Prism-$(WHISKEY_SEMVER2_NO_BUILD_METADATA).zip' '-DeploymentName' 'GitHub'
  .OnlyBy: BuildServer

- Exec: appveyor PushArtifact 'Scripts/init.ps1' -DeploymentName 'GitHub'
  .OnlyBy: BuildServer

- PublishPowerShellModule:
    Path: Prism

- Exec: appveyor PushArtifact '$(WHISKEY_OUTPUT_DIRECTORY)/Prism.$(WHISKEY_SEMVER2_NO_BUILD_METADATA).nupkg' -DeploymentName 'PowerShellGallery'
  .OnlyBy: BuildServer

- Pester:
    Configuration:
        Run:
            Path: Tests\*.Tests.ps1
            Exit: true
            Throw: true
        TestResult:
            Enabled: true
            OutputPath: .output\pester.xml
            TestSuiteName: Prism
        Output:
            Verbosity: Detailed
